[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raya-core"
version = "1.0.0"
description = "RAYA evidence engine: discover, verify, anchor."
requires-python = ">=3.10"
dependencies = [
  "opencv-python>=4.9",
  "numpy>=1.26",
  "pillow>=10",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "web3>=6.15",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["raya*"]
