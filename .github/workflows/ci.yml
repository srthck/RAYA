name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Models are git-ignored (39 MB) and checksum-verified on download, so the
      # cache key can safely be the fetch script itself.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Fetch models
        run: python scripts/fetch_models.py

      - name: Test
        run: pytest -q

      - name: Demo cases must all run
        run: python demo/run_demo.py

  contracts:
    name: Solidity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - run: npm ci || npm install
      - run: npx hardhat compile
      - run: npx hardhat test

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci || npm install
      - run: npx tsc --noEmit
      - run: npm run build
